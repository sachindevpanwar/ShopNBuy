<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>[[${pageTitle}]]</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" type="text/css"/>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</head>
<body>
    <div class="container-fluid">
        <div>
            <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/images/ShopNBuyAdminSmall.png}" style="width: 100px; height: 85px; border-radius:50%; margin-left:2px;" alt="ShopNBuy"/>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="topNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" th:href="@{/users}">Users</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/categories}">Categories</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/brands}">Brands</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/products}">Products</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Customers</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/shipping}">Shipping</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/orders}">Orders</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/report}">Sales Report</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/articles}">Articles</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/menus}">Menus</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/settings}">Settings</a></li>
                    </ul>
                </div>
            </nav>
        </div>
        <h1 class="mt-4">Manage Users | [[${pageTitle}]]</h1>

        <div class="mt-4">
            <form th:action="@{/users/save}" method="post" style="max-width: 700px; margin: auto;" th:object="${user}" onsubmit="return checkEmailUnique(this);">
							<div class="border border-secondary rounded p-5">
                <div class="form-group row">
                    <label for="email" class="col-form-label col-sm-4">Email</label>
										<div class="col-sm-8">
											<input type="email" class="form-control" id="email" placeholder="Enter email" th:field="*{email}" required minlength="8" maxlength="128" />
										</div>
                </div>
								<div class="form-group row">
									<label for="firstName" class="col-form-label col-sm-4">First Name:</label>
									<div class="col-sm-8">
										<input type="text" class="form-control" id="firstName" placeholder="Enter First Name" th:field="*{firstName}" required minlength="2" maxlength="45" />
									</div>
							</div>

							<div class="form-group row">
								<label for="lastName" class="col-form-label col-sm-4">Last Name:</label>
								<div class="col-sm-8">
									  <input type="text" class="form-control" id="lastName" placeholder="Enter Last Name" th:field="*{lastName}" required minlength="2" maxlength="45" />
								</div>
						  </div>

							<div class="form-group row">
								<label for="password" class="col-form-label col-sm-4">Password:</label>
								<div class="col-sm-8">
									<input type="password" class="form-control" id="password" placeholder="Enter Password" th:field="*{password}" required minlength="8" maxlength="20" />
								</div>
						  </div>
  
							<div class="form-group row">
								<label for="password" class="col-form-label col-sm-4">Roles:</label>
								<div class="col-sm-8">
									<th:block th:each="role : ${listRoles}"> 
										<input type="checkbox" th:field="*{roles}"
										th:text="${role.name}"
										th:value="${role.id}"
										class="m-2"
										/>
										- <small>[[${role.description}]]</small>
								</br>
									</th:block>
								</div>
						  </div>
         
               
                <div class="form-group row">
                        <label class="col-sm-4 col-form-label" for="enabled">Enabled:</label>
												<div class="col-sm-8">
													<input class="form-check-input" type="checkbox" th:field="*{enabled}">
												</div>
                </div>
                <div class="mb-3">
                    <label for="photo" class="form-label">Choose Photo</label>
                    <input class="form-control" type="file" id="photo">
                    <small class="form-text text-muted">No file chosen</small>
                </div>
                <div class="text-center">
                    <button type="submit" value="Save" class="btn btn-primary m-3">Save</button>
                    <button type="button" value="Cancel" class="btn btn-secondary" onclick="window.history.back();">Cancel</button>
                </div>
            
			</div>	
		</form>
        <!-- Warning modal for duplicate email -->
        <div class="modal fade text-center" id="modalDialog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="modalTitle">Warning</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <span id="modalBody"></span>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger close" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>


        </div>
    </div>
    <div class="text-center mt-4">
        <p>ShopNBuy Control Panel - Copyright &copy; ShopNBuy</p>
    </div>

    <script type="text/javascript">
        function checkEmailUnique(form) {
    let url = "[[@{/users/check_email}]]";  // Thymeleaf URL syntax
    let userEmail = $("#email").val();
    let userId = $("#id").val();
    let csrfValue = $("input[name='_csrf']").val();

    let params = {id: userId, email: userEmail, _csrf: csrfValue};

    $.post(url, params, function (response) {
        if (response === "OK") {
            form.submit();  // Submit the form if email is unique
        } else if (response === "Duplicated") {
            showWarningModal("There is another user having the email " + userEmail);
        } else {
            showErrorModal("Unknown response from server");
        }
    }).fail(function () {
        showErrorModal("Could not connect to the server");
    });

    return false;  // Prevent the default form submission
}

function showModalDialog(title, message) {
    $("#modalTitle").text(title);
    $("#modalBody").text(message);
    $("#modalDialog").modal("show");
}

function showErrorModal(message) {
    showModalDialog("Error", message);
}

function showWarningModal(message) {
    showModalDialog("Warning", message);
}
    </script>
</body>
</html>
